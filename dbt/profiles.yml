supply_chain:
  target: local
  outputs:
    local:                      # runs anywhere, no cloud account needed
      type: duckdb
      path: "{{ env_var('SCOPS_WAREHOUSE', '../data/warehouse.duckdb') }}"
      threads: 4
    databricks:                 # same models, Unity Catalog on Databricks
      type: databricks
      host: "{{ env_var('DATABRICKS_HOST', '') }}"
      http_path: "{{ env_var('DATABRICKS_HTTP_PATH', '') }}"
      token: "{{ env_var('DATABRICKS_TOKEN', '') }}"
      catalog: "{{ env_var('DATABRICKS_CATALOG', 'supply_chain') }}"
      schema: ops
      threads: 4
